<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工程微创新孵化平台 · CASE-001</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#172a41;font:14px system-ui,"Microsoft YaHei",sans-serif}header{height:80px;background:white;border-bottom:1px solid #dbe3eb;display:flex;align-items:center;justify-content:space-between;padding:0 28px}h1{font-size:22px;margin:0 0 6px}small{color:#64748b}button,select{padding:8px 12px;border:1px solid #cbd5e1;background:white;border-radius:7px;color:#243c58;cursor:pointer}button:hover{background:#e7f0ff}main{display:flex;height:calc(100vh - 80px)}#view{flex:1;min-width:0;position:relative}canvas{display:block;width:100%;height:100%;touch-action:none}aside{width:282px;padding:22px;background:white;border-left:1px solid #dbe3eb;overflow:auto}aside h3{font-size:15px;margin:18px 0 10px}label{display:block;margin:10px 0}input[type=range]{width:100%}.badge{background:#fff0e9;color:#a34a19;border:1px solid #f4d5bc;border-radius:6px;padding:10px;line-height:1.7}.card{margin:14px 0;padding:12px;background:#f5f7fa;border-radius:8px;line-height:1.7}#hint{position:absolute;bottom:18px;left:22px;color:#5e738c;background:#ffffffdf;padding:8px 14px;border-radius:8px;pointer-events:none}#error{position:absolute;top:20px;left:20px;color:#a00}#pick{min-height:55px;font-size:12px;word-break:break-all}#status{font-size:12px;color:#60728b}</style>
<header><div><h1>工程微创新孵化平台</h1><small>CASE-001 下倒角加固装置 · 单文件离线模型查看器</small></div><div><button id="reset">适应窗口</button> <button id="capture">导出模型截图</button></div></header>
<main><div id="view"><div id="error"></div><div id="hint">拖动旋转 · 滚轮缩放 · 点击构件查看编号</div></div><aside><div class="badge">可调设计草案<br>工程复核与人工确认：待完成</div><div class="card">本模型、DXF、清单和效果图来自同一几何场景。构件数量由脚本计算。</div><h3>模型显示</h3><label><input id="grid" type="checkbox" checked> 横竖网格</label><label><input id="wire" type="checkbox"> 网格边线</label><h3>剖切检查</h3><label><input id="clip" type="checkbox"> 开启剖切</label><select id="axis"><option value="0">X 方向</option><option value="1">Y 方向</option><option value="2" selected>Z 方向</option></select><input id="plane" type="range" min="0" max="100" value="50"><small>剖切仅隐藏一侧，不生成封闭切面；不能据此计算截面性质。</small><h3>构件信息</h3><div id="pick" class="card">点击模型中的构件</div><div id="status"></div><h3>工程边界</h3><small>传振连接、荷载、焊缝、材质与公差仍需工程师复核。加工、正式申报和受力关键构件须另行审定。</small></aside></main>
<script>__THREE_LIBRARY__</script><script id="model-data" type="application/json">__MODEL_JSON__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('model-data').textContent),host=document.getElementById('view');
try{
const scene=new THREE.Scene();scene.background=new THREE.Color('#f6f8fb');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.localClippingEnabled=true;host.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(38,1,.1,100000);camera.up.set(0,0,1);
const group=new THREE.Group();scene.add(group);let objects=[];const clipPlane=new THREE.Plane(new THREE.Vector3(0,0,-1),0);
for(const part of data.parts){let geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(part.vertices.flat(),3));geo.setIndex(part.triangles.flat());geo.computeVertexNormals();const mat=new THREE.MeshStandardMaterial({color:new THREE.Color(...part.color.map(x=>x/255)),metalness:.18,roughness:.63,side:THREE.DoubleSide});const item=new THREE.Mesh(geo,mat);item.userData=part;group.add(item);objects.push(item)}
const box=new THREE.Box3().setFromObject(group),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());group.position.copy(center).negate();
scene.add(new THREE.HemisphereLight(0xffffff,0x76879b,2));const light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(1000,-2000,3000);scene.add(light);
const grid=new THREE.GridHelper(4000,40,0xc5d0dd,0xe1e7ee);grid.rotation.x=Math.PI/2;grid.position.z=box.min.z-center.z-8;scene.add(grid);
let radius=Math.max(size.x,size.y,size.z)*1.8,az=-.9,el=.65,drag=null,moved=false,selected=null;
function draw(){camera.position.set(radius*Math.cos(el)*Math.cos(az),radius*Math.cos(el)*Math.sin(az),radius*Math.sin(el));camera.lookAt(0,0,0);renderer.render(scene,camera)}
function resize(){renderer.setSize(host.clientWidth,host.clientHeight);camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();draw()}
function clipping(){let a=Number(document.getElementById('axis').value),t=Number(document.getElementById('plane').value)/100,n=new THREE.Vector3();n.setComponent(a,-1);clipPlane.normal.copy(n);clipPlane.constant=box.min.getComponent(a)-center.getComponent(a)+size.getComponent(a)*t;for(const obj of objects)obj.material.clippingPlanes=document.getElementById('clip').checked?[clipPlane]:[];draw()}
renderer.domElement.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];moved=false;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag[0],dy=e.clientY-drag[1];if(Math.abs(dx)+Math.abs(dy)>1)moved=true;az-=dx*.008;el=Math.max(-1.4,Math.min(1.4,el+dy*.008));drag=[e.clientX,e.clientY];draw()});
renderer.domElement.addEventListener('pointerup',e=>{drag=null;if(moved)return;let rect=renderer.domElement.getBoundingClientRect(),pointer=new THREE.Vector2((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1),ray=new THREE.Raycaster();ray.setFromCamera(pointer,camera);let hit=ray.intersectObjects(objects).find(h=>!document.getElementById('clip').checked||clipPlane.distanceToPoint(h.point)>=0);if(selected)selected.material.emissive.setHex(0);selected=hit?hit.object:null;if(selected){selected.material.emissive.setHex(0x193b51);document.getElementById('pick').textContent=selected.userData.id+' · '+selected.userData.name}draw()});
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();radius=Math.max(150,Math.min(15000,radius*Math.exp(e.deltaY*.001)));draw()},{passive:false});
document.getElementById('reset').onclick=()=>{radius=Math.max(size.x,size.y,size.z)*1.8;az=-.9;el=.65;draw()};
document.getElementById('grid').onchange=e=>{grid.visible=e.target.checked;draw()};document.getElementById('wire').onchange=e=>{for(const o of objects)o.material.wireframe=e.target.checked;draw()};
for(const id of ['clip','axis','plane'])document.getElementById(id).oninput=clipping;
document.getElementById('capture').onclick=()=>{draw();const a=document.createElement('a');a.href=renderer.domElement.toDataURL('image/png');a.download='CASE-001_模型截图_设计草案.png';a.click()};
document.getElementById('status').textContent=data.parts.length+' 个几何实例 · '+data.run_id;window.addEventListener('resize',resize);resize();
window.__verification={parts:objects.length,triangles:objects.reduce((n,o)=>n+o.geometry.index.count/3,0),ready:true};
}catch(e){document.getElementById('error').textContent='三维显示失败：'+e.message+'。请在支持 WebGL 的浏览器打开下载后的 HTML。';window.__verification={ready:false,error:e.message}}
</script></html>
